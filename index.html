<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TV+ trailer</title>
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}#p{position:absolute;left:0;top:0;width:100%;height:100%;border:0}</style>
</head><body>
<div id="p"></div>
<script>
(function () {
  var m = /[?&]v=([\w-]{6,20})/.exec(location.search), id = m && m[1], pl = null;
  function say(t, info) { try { parent.postMessage({ tvp: t, info: info }, '*'); } catch (e) {} }
  if (!id) { say('error', 'no id'); return; }
  window.onYouTubeIframeAPIReady = function () {
    pl = new YT.Player('p', {
      videoId: id, width: '100%', height: '100%',
      playerVars: { autoplay: 1, controls: 0, rel: 0, modestbranding: 1, iv_load_policy: 3, playsinline: 1, fs: 0, disablekb: 1, origin: location.origin },
      events: {
        onReady: function (e) { say('ready'); try { e.target.playVideo(); } catch (x) {} },
        onStateChange: function (e) { if (e.data === 1) say('playing'); else if (e.data === 0) say('ended'); },
        onError: function (e) { say('error', e.data); }
      }
    });
  };
  var s = document.createElement('script'); s.src = 'https://www.youtube.com/iframe_api';
  s.onerror = function () { say('error', 'api blocked'); };
  document.head.appendChild(s);
  window.addEventListener('message', function (e) {        
    var d = e.data; if (!d || !pl) return;
    try { if (d.tvp === 'pause') pl.pauseVideo(); else if (d.tvp === 'play') pl.playVideo(); } catch (x) {}
  });
})();
</script></body></html>
